name: ${COMPOSE_PROJECT_NAME:-rutasur}

services:
  kafka:
    image: apache/kafka:4.1.0
    hostname: kafka
    restart: unless-stopped
    ports:
      - "127.0.0.1:${KAFKA_EXTERNAL_PORT:-19092}:29092"
    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-MkU3OEVBNTcwNTJENDM2Qk}
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:${KAFKA_EXTERNAL_PORT:-19092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - rutasur-kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list >/dev/null 2>&1"]
      interval: 15s
      timeout: 20s
      retries: 5
      start_period: 30s

  kafka-init:
    image: apache/kafka:4.1.0
    restart: "no"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    entrypoint: ["/bin/bash", "/scripts/create-topics.sh"]
    volumes:
      - ./infra/kafka/create-topics.sh:/scripts/create-topics.sh:ro

  mongo:
    image: mongo:8.0.12
    hostname: mongo
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    ports:
      - "127.0.0.1:${MONGODB_EXTERNAL_PORT:-27028}:27017"
    volumes:
      - rutasur-mongo-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'quit(db.adminCommand({ ping: 1 }).ok ? 0 : 1)'"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  mongo-init:
    image: mongo:8.0.12
    restart: "no"
    depends_on:
      mongo:
        condition: service_healthy
    entrypoint: ["mongosh", "mongodb://mongo:27017/admin?directConnection=true", "--quiet", "--file", "/scripts/init-replica-set.js"]
    volumes:
      - ./infra/mongo/init-replica-set.js:/scripts/init-replica-set.js:ro

  simulator:
    profiles: ["simulator"]
    build:
      context: .
      dockerfile: services/simulator/Dockerfile
    restart: "no"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BROKERS: kafka:9092
      SIMULATOR_SEED: ${SIMULATOR_SEED:-2026}
      SIMULATOR_START_AT: ${SIMULATOR_START_AT:-2026-10-18T08:00:00.000Z}
      SIMULATOR_ACCELERATION: ${SIMULATOR_ACCELERATION:-120}
      SIMULATOR_SHIPMENTS_PER_MINUTE: ${SIMULATOR_SHIPMENTS_PER_MINUTE:-20}
      SIMULATOR_ZONE_FAILURE_RATES: ${SIMULATOR_ZONE_FAILURE_RATES:-ZONA-NORTE=0.05,ZONA-CENTRO=0.15,ZONA-SUR=0.30}
      SIMULATOR_FAILURE_REASONS: ${SIMULATOR_FAILURE_REASONS:-AUSENTE=0.60,DIRECCION_INCORRECTA=0.20,RECHAZADO=0.15,ZONA_INACCESIBLE=0.05}
      SIMULATOR_HUB_DELAY_PROBABILITY: ${SIMULATOR_HUB_DELAY_PROBABILITY:-0.10}
      SIMULATOR_DUPLICATE_PROBABILITY: ${SIMULATOR_DUPLICATE_PROBABILITY:-0.02}
      SIMULATOR_OUT_OF_ORDER_PROBABILITY: ${SIMULATOR_OUT_OF_ORDER_PROBABILITY:-0.02}
      SIMULATOR_MALFORMED_PROBABILITY: ${SIMULATOR_MALFORMED_PROBABILITY:-0.01}
    entrypoint: ["node", "services/simulator/src/cli.js"]
    command: ["continuous"]
    stop_grace_period: 10s

  projector:
    profiles: ["projector"]
    build:
      context: .
      dockerfile: services/projector/Dockerfile
    restart: "no"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      mongo-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BROKERS: kafka:9092
      MONGODB_URI: mongodb://mongo:27017/rutasur?replicaSet=rs0
      PROJECTOR_GENERATION: main
    entrypoint: ["node", "services/projector/src/cli.js"]
    command: ["run"]
    stop_grace_period: 20s

  notifications:
    profiles: ["business"]
    build:
      context: .
      dockerfile: services/business/Dockerfile
    restart: "no"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      mongo-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BROKERS: kafka:9092
      MONGODB_URI: mongodb://mongo:27017/rutasur?replicaSet=rs0
      BUSINESS_UTC_OFFSET_MINUTES: ${BUSINESS_UTC_OFFSET_MINUTES:--180}
      BUSINESS_HOLIDAYS: ${BUSINESS_HOLIDAYS:-}
    command: ["node", "services/notifications/src/cli.js"]
    stop_grace_period: 20s

  rescheduling:
    profiles: ["business"]
    build:
      context: .
      dockerfile: services/business/Dockerfile
    restart: "no"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      mongo-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BROKERS: kafka:9092
      MONGODB_URI: mongodb://mongo:27017/rutasur?replicaSet=rs0
      BUSINESS_UTC_OFFSET_MINUTES: ${BUSINESS_UTC_OFFSET_MINUTES:--180}
      BUSINESS_HOLIDAYS: ${BUSINESS_HOLIDAYS:-}
    command: ["node", "services/rescheduling/src/cli.js"]
    stop_grace_period: 20s

  analytics:
    profiles: ["business"]
    build:
      context: .
      dockerfile: services/business/Dockerfile
    restart: "no"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      mongo-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BROKERS: kafka:9092
      MONGODB_URI: mongodb://mongo:27017/rutasur?replicaSet=rs0
      BUSINESS_UTC_OFFSET_MINUTES: ${BUSINESS_UTC_OFFSET_MINUTES:--180}
      BUSINESS_HOLIDAYS: ${BUSINESS_HOLIDAYS:-}
    command: ["node", "services/analytics/src/cli.js"]
    stop_grace_period: 20s

  sla-monitor:
    profiles: ["sla"]
    build:
      context: .
      dockerfile: services/sla-monitor/Dockerfile
    restart: "no"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      mongo-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BROKERS: kafka:9092
      MONGODB_URI: mongodb://mongo:27017/rutasur?replicaSet=rs0
      SIMULATOR_ACCELERATION: ${SIMULATOR_ACCELERATION:-120}
      BUSINESS_UTC_OFFSET_MINUTES: ${BUSINESS_UTC_OFFSET_MINUTES:--180}
      SLA_EVALUATION_INTERVAL_SIMULATED_MS: ${SLA_EVALUATION_INTERVAL_SIMULATED_MS:-60000}
    stop_grace_period: 20s

  simulator-control:
    profiles: ["web"]
    build:
      context: .
      dockerfile: services/simulator/Dockerfile
    restart: "no"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BROKERS: kafka:9092
      SIMULATOR_CONTROL_HOST: 0.0.0.0
      SIMULATOR_CONTROL_PORT: 3001
      SIMULATOR_START_AT: ${SIMULATOR_START_AT:-2026-10-18T08:00:00.000Z}
      SIMULATOR_ACCELERATION: ${SIMULATOR_ACCELERATION:-120}
    entrypoint: ["node", "services/simulator/src/control.js"]
    stop_grace_period: 20s

  web:
    profiles: ["web"]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: "no"
    depends_on:
      mongo-init:
        condition: service_completed_successfully
      simulator-control:
        condition: service_started
    environment:
      MONGODB_URI: mongodb://mongo:27017/rutasur?replicaSet=rs0
      SIMULATOR_CONTROL_URL: http://simulator-control:3001
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    stop_grace_period: 20s

  hub-analytics:
    profiles: ["hubs"]
    build:
      context: .
      dockerfile: services/hub-analytics/Dockerfile
    restart: "no"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      mongo-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BROKERS: kafka:9092
      MONGODB_URI: mongodb://mongo:27017/rutasur?replicaSet=rs0
      BUSINESS_UTC_OFFSET_MINUTES: ${BUSINESS_UTC_OFFSET_MINUTES:--180}
      HUB_GENERATION: ${HUB_GENERATION:-main}
    stop_grace_period: 20s

volumes:
  rutasur-kafka-data:
    name: ${COMPOSE_PROJECT_NAME:-rutasur}-kafka-data
  rutasur-mongo-data:
    name: ${COMPOSE_PROJECT_NAME:-rutasur}-mongo-data